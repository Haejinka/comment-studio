name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows app and browser checks
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run docs:check
      - run: npx playwright install chromium
      - run: npm test
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/playwright-results
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-diagnostics
          path: |
            ${{ runner.temp }}/playwright-results
            samples/reply-heading*.png
          if-no-files-found: ignore
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run dist:win
      - run: npm run package:win
      - uses: actions/upload-artifact@v7
        with:
          name: comment-studio-windows-x64
          path: |
            release/Comment-Studio.exe
            release/Comment-Studio-Setup.exe
            release/Comment-Studio.ico
            release/START-HERE.txt
            release/WINDOWS.md
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
